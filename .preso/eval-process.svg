<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933">
  <!-- The eval process: one task x arm cell (top row), and the improvement loop around it (bottom). -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <g stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="190" y1="205" x2="255" y2="205"/>
    <line x1="500" y1="205" x2="555" y2="205"/>
    <line x1="735" y1="205" x2="790" y2="205"/>
    <line x1="990" y1="205" x2="1035" y2="205"/>
    <!-- the reference goes to the judges only -->
    <path d="M 105 150 L 105 62 L 890 62 L 890 96" stroke-dasharray="7,5"/>
  </g>
  <text x="497" y="50" text-anchor="middle" font-size="17" fill="#52606d">reference answer + required facts (the agent never sees them)</text>
  <text x="222" y="195" text-anchor="middle" font-size="15" fill="#52606d">prompt</text>

  <!-- Task -->
  <rect x="20" y="150" width="170" height="110" rx="12" fill="#dbeafe" stroke="#1f6feb" stroke-width="2"/>
  <text x="105" y="185" text-anchor="middle" font-weight="bold" font-size="22">Task</text>
  <text x="105" y="213" text-anchor="middle" font-size="16">prompt</text>
  <text x="105" y="235" text-anchor="middle" font-size="16">reference + facts</text>

  <!-- Arm, with the agent's tool loop inside -->
  <rect x="260" y="105" width="240" height="200" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="137" text-anchor="middle" font-weight="bold" font-size="22">Arm</text>
  <text x="380" y="161" text-anchor="middle" font-size="15">same model + system prompt</text>
  <rect x="280" y="180" width="85" height="50" rx="8" fill="white" stroke="#d97706"/>
  <text x="322" y="211" text-anchor="middle" font-size="16">model</text>
  <rect x="395" y="180" width="85" height="50" rx="8" fill="white" stroke="#d97706"/>
  <text x="437" y="204" text-anchor="middle" font-size="16">tools</text>
  <text x="437" y="222" text-anchor="middle" font-size="12" fill="#52606d">MCP/shell/web</text>
  <g stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="367" y1="197" x2="393" y2="197"/>
    <line x1="393" y1="215" x2="367" y2="215"/>
  </g>
  <text x="380" y="285" text-anchor="middle" font-size="14" fill="#52606d">loop until it answers (budget)</text>

  <!-- Answer -->
  <rect x="560" y="150" width="175" height="110" rx="12" fill="#f3f4f6" stroke="#52606d" stroke-width="2"/>
  <text x="647" y="185" text-anchor="middle" font-weight="bold" font-size="22">Answer</text>
  <text x="647" y="213" text-anchor="middle" font-size="16">+ tokens, time,</text>
  <text x="647" y="235" text-anchor="middle" font-size="16">tool-call trace</text>

  <!-- Judges -->
  <rect x="795" y="100" width="195" height="210" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="892" y="131" text-anchor="middle" font-weight="bold" font-size="22">Judges</text>
  <rect x="815" y="145" width="155" height="40" rx="8" fill="white" stroke="#16a34a"/>
  <text x="892" y="171" text-anchor="middle" font-size="16">Code checks</text>
  <rect x="815" y="195" width="155" height="40" rx="8" fill="white" stroke="#16a34a"/>
  <text x="892" y="221" text-anchor="middle" font-size="16">LLM judge</text>
  <rect x="815" y="245" width="155" height="40" rx="8" fill="white" stroke="#16a34a"/>
  <text x="892" y="271" text-anchor="middle" font-size="16">Jev</text>

  <!-- Results -->
  <rect x="1040" y="150" width="145" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1112" y="185" text-anchor="middle" font-weight="bold" font-size="22">Results</text>
  <text x="1112" y="213" text-anchor="middle" font-size="16">verdicts +</text>
  <text x="1112" y="235" text-anchor="middle" font-size="16">metrics</text>

  <!-- The improvement loop -->
  <path d="M 1112 260 L 1112 400 L 380 400 L 380 312" stroke="#1f6feb" stroke-width="3" fill="none" marker-end="url(#b)"/>
  <g font-size="18" text-anchor="middle">
    <rect x="455" y="380" width="170" height="40" rx="20" fill="white" stroke="#1f6feb" stroke-width="2"/>
    <text x="540" y="406">change one thing</text>
    <rect x="665" y="380" width="170" height="40" rx="20" fill="white" stroke="#1f6feb" stroke-width="2"/>
    <text x="750" y="406">read transcripts</text>
    <rect x="875" y="380" width="170" height="40" rx="20" fill="white" stroke="#1f6feb" stroke-width="2"/>
    <text x="960" y="406">compare runs</text>
  </g>
  <text x="750" y="455" text-anchor="middle" font-size="16" fill="#1f6feb">the tools (javadocs.dev MCP), the model, the prompt, or the eval itself, then run again</text>
</svg>
