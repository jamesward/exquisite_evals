spring.main.web-application-type=none

# Agent model on Bedrock mantle. Most mantle models (Kimi, GLM, DeepSeek, Qwen, Mistral...) only support Chat
# Completions; gpt-oss also supports the Responses API (AGENT_API=responses, as in the 2026-09-30/10-02 runs).
# /v1 serves these; /openai/v1 serves the GPT-5.x family (needed for hosted web_search).
spring.ai.openai.chat.api=${AGENT_API:chat-completions}
spring.ai.openai.base-url=${BEDROCK_MANTLE_BASE_URL:https://bedrock-mantle.us-east-1.api.aws/v1}
spring.ai.openai.api-key=${AWS_BEARER_TOKEN_BEDROCK}
spring.ai.openai.chat.model=${AGENT_MODEL:moonshotai.kimi-k2.5}
spring.ai.openai.responses.model=${AGENT_MODEL:moonshotai.kimi-k2.5}

# LLM judge: a different model family from the agent, always over Chat Completions on mantle /v1.
evals.judge.model=${JUDGE_MODEL:deepseek.v3.2}
spring.ai.openai.timeout=180s

spring.ai.mcp.client.streamable-http.connections.javadocs.url=https://www.javadocs.dev/mcp

spring.ai.typesafe.api-key=${TYPESAFE_API_KEY:}

spring.threads.virtual.enabled=true

# Optional arms: web-brave needs a Brave key; web-bedrock needs a GPT-5.x model this account can use.
evals.brave-api-key=${BRAVE_API_KEY:}
evals.bedrock-web-search.model=${BEDROCK_WEB_SEARCH_MODEL:}

# Embeddings for the mcp-toolsearch-vector arm (Bedrock runtime InvokeModel; mantle has no embedding models)
evals.embedding.model=cohere.embed-english-v3
evals.embedding.base-url=https://bedrock-runtime.us-east-1.amazonaws.com
